# The NSIS installer stamps this onto the Start Menu shortcut as its AUMID.
# `APP_USER_MODEL_ID` in main/index.ts must match it exactly, or Windows treats
# the running window and the installed shortcut as two different applications.
appId: dev.artemis.app
productName: Artemis
copyright: Artemis contributors

directories:
  output: release
  buildResources: build

# `out/` is the electron-vite build output. Runtime dependencies that must not
# be bundled (the Claude Agent SDK spawns processes and reads from disk) are
# shipped as real node_modules alongside it.
files:
  - out/**/*
  - package.json

# The browser extension, as a zip the app can hand over with no network.
#
# `extraResources` rather than `asarUnpack` because nothing executes it: it is
# a file the user saves and then loads into Chrome by hand, so it wants to be a
# real path under `resources/` and not a member of the archive. `main/index.ts`
# reads the version out of its *file name* rather than opening it, which is how
# the Browser pane can say a paired browser's extension is behind without
# unzipping anything on every launch.
#
# The directory is committed (holding only a README) so this copy always has a
# source. A build that has not run `scripts/package-extension.ts` ships no zip,
# and the pane says this copy of Artemis does not have the extension rather
# than offering a button that saves nothing.
extraResources:
  - from: build/extension
    to: extension
    filter:
      - '**/*.zip'

# Neither of these can be read out of the archive. The Agent SDK spawns its own
# binaries; node-pty has to `dlopen` a `.node` binding and, on macOS and Linux,
# `exec` the `spawn-helper` beside it — and there is no path into an asar that
# either call can use.
asarUnpack:
  - '**/node_modules/@anthropic-ai/claude-agent-sdk/**'
  - '**/node_modules/node-pty/**'

# Nothing *executable* is shipped beside the asar — the browser-extension zip
# above is a file the user saves, not code this app runs. Artemis used to
# vendor the cerebro CLI here for bootstrap; it no longer needs one — reading, installing, describing
# and writing a bank are core's, and the single job left for a CLI (wiring a
# bank into stock Claude Code) is done by the bank's own embedded copy. See
# main/memoryBanks.ts.

# Unpacking preserves the mode the file had in the archive, and node-pty
# publishes `spawn-helper` as 0644 — so without this every install arrives
# unable to exec the helper, and every terminal fails with `posix_spawnp
# failed`. The hook sets the bit while the bundle is still writable, which is
# the only time it can be set for an install the user does not own. See
# `build/after-pack.cjs`.
afterPack: ./build/after-pack.cjs

mac:
  category: public.app-category.developer-tools
  # The arch is part of every name, x64 included — electron-builder's default
  # omits it for x64, which makes "which file is this?" a trick question the
  # moment two architectures share a release page.
  artifactName: ${productName}-${version}-${arch}-mac.${ext}
  target:
    - dmg
    - zip

win:
  target:
    - nsis

nsis:
  # The name the in-app updater downloads. `latest.yml` carries it as the feed's
  # top-level `path`, and `main/updateFeed.ts` refuses a feed whose path is not
  # an `.exe` — so this pattern and that check move together. The arch is in the
  # name for the same reason it is in the mac one: two builds on one release
  # page must not be a guessing game.
  artifactName: ${productName}-${version}-${arch}-setup.${ext}

linux:
  category: Development
  # A scoped npm package name otherwise becomes `@rx-artemisdesktop` on
  # Linux. Keep the installed command and the unpacked binary predictable.
  executableName: artemis
  artifactName: ${productName}-${version}-${arch}.${ext}
  target:
    - AppImage
    - deb
    - pacman

# The Arch package's dependencies, stated rather than inherited.
#
# electron-builder's default list for the pacman target is a constant inside
# app-builder-lib (`FpmTarget.getDefaultDepends`) that describes a *different*
# build of Electron than the one shipped here: `c-ares`, `ffmpeg`, `libevent`,
# `libvpx`, `libxslt`, `minizip`, `re2`, `snappy` are the system libraries Arch's
# own `electron` package links against because it is compiled with the
# `use_system_*` GN flags. This build is the prebuilt Electron, which carries
# every one of them inside itself, so each was a dependency the package claimed
# and did not have.
#
# That was cosmetic until one of the names stopped existing. `http-parser` was
# dropped from the Arch repositories, and a dependency that cannot be resolved
# is not a warning — `pacman -U` refuses the transaction, so 2.16.1 could not be
# installed over 2.4.8 at all, and `main/updater.ts` could not install it either:
# it hands the file to `pacman -U --noconfirm`, and `--noconfirm` answers "no" to
# the prompt offering to skip the package. Every Arch machine's in-app update
# would have failed at the last step, after a correct download and checksum.
#
# So the list below is the one the binaries actually ask for: every soname in a
# `readelf -d` of `artemis`, `chrome_crashpad_handler` and the shipped `.so`s,
# mapped to its owning package, minus the three that `base` guarantees (glibc,
# gcc-libs, systemd-libs). Two entries are not in that output and are here on
# purpose:
#
#   - `libnotify` — Electron `dlopen`s it for `new Notification()`, which
#     main/index.ts uses, so no NEEDED entry names it.
#   - `xdg-utils` — `shell.openExternal` (main/security.ts) execs `xdg-open`.
#
# `libappindicator-gtk3` was in the defaults and is gone from here: it is for
# `Tray`, and nothing in the app constructs one. `libxss` is gone because
# current Electron no longer links libXss.
#
# Regenerate this the same way after an Electron major, and check the result
# resolves — `pacman -T <the list>` names anything that no longer exists.
pacman:
  depends:
    - alsa-lib
    - at-spi2-core
    - cairo
    - dbus
    - expat
    - gtk3
    - hicolor-icon-theme
    - libcups
    - libnotify
    - libx11
    - libxcb
    - libxcomposite
    - libxdamage
    - libxext
    - libxfixes
    - libxkbcommon
    - libxrandr
    - mesa
    - nspr
    - nss
    - pango
    - xdg-utils

# Declaring the provider makes electron-builder emit an update feed beside the
# artifacts — latest-mac.yml from a mac build, latest.yml from a Windows one,
# each naming the artifact that build's updater installs. Actual publishing is
# done by scripts/release.ts via `gh` after every gate has passed — the dist
# build always runs with `--publish never`.
publish:
  provider: github
  # The repository moved from the Rx-Ventures org to seth-torrence on
  # 2026-08-30. GitHub redirects the old path, which is why builds kept
  # working — but a redirect is not a guarantee: the moment anything is
  # created at the old name the redirect stops and every installed client
  # silently checks a repository we do not own. This value is baked into
  # `app-update.yml` inside each build, so it is the one that decides where
  # installed copies look for their updates.
  owner: seth-torrence
  repo: artemis

npmRebuild: false
