# Headless Artemis, composed.
#
#   docker compose -f docker/docker-compose.yml up -d --build
#
# First-time setup, all inside the running container:
#
#   # 1. Register the serving account and sign it in:
#   docker compose -f docker/docker-compose.yml exec artemis \
#     node /app/dist/main.js profile add --label work
#   docker compose -f docker/docker-compose.yml exec -it \
#     -e CLAUDE_CONFIG_DIR=/data/profiles/work artemis claude auth login
#
#   # 2. Mint a connection token pinned to a mounted repository:
#   docker compose -f docker/docker-compose.yml exec artemis \
#     node /app/dist/main.js connection create --label laptop --directory /work/my-repo
#
#   # 3. On each laptop: add an "Artemis Server" profile, address
#   #    http://<server-tailscale-ip>:6472, and paste the token as its API key.
#
# Step 1 assumes a shell in here, which is the assumption that does not hold
# under an orchestrator — `exec` reaches an arbitrary replica, and a web
# terminal served over plain HTTP cannot even paste. So the login can also be
# driven from the desktop app: mint the laptop's token with
#
#   node /app/dist/main.js connection create --label me --directory /work/my-repo \
#     --manage-profiles
#
# and its profile's card gains an "Accounts on this server" section that adds
# an account and runs the provider's login here, showing you the verification
# URL and taking the code you paste. Give that flag to your own token and to no
# other: it is the one grant not bounded by a directory or an allowance.
#
# Reachability is this file's `ports` plus whatever network sits in front
# (Tailscale, a firewall). Every request still authenticates per connection
# token, and each token sees only the sessions its own scope created.

services:
  artemis:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: artemis-server
    restart: unless-stopped
    ports:
      - '6472:6472'
    volumes:
      # Everything the server is: profiles, credentials, tokens, the session
      # ledger. Back this up; treat it as secret material.
      - artemis-data:/data
      # The work. Mount each repository you want connections to pin.
      # - /srv/repos:/work
    environment:
      ARTEMIS_DATA_DIR: /data
      ARTEMIS_BIND_HOST: 0.0.0.0
      # Connections to make sure exist at startup, for a deploy that cannot run
      # step 2 above interactively — an orchestrator (Swarm, Nomad, a PaaS)
      # where `exec` reaches an arbitrary replica and the first token is the one
      # thing that cannot be minted from outside. Merged into server.json and
      # idempotent: nothing is ever removed, a connection this variable does not
      # name is untouched, and `connection revoke` still works. Editing an entry
      # here and redeploying *updates* that grant — matched by token, so the id
      # and creation time survive and the clients keep the token they have.
      # Supply the tokens from wherever the deployment already keeps secrets —
      # they are the same strings the clients get — and use at least 32
      # characters. The CLI stays the interactive path; this is for the machines.
      #
      # `"manageProfiles": true` lets that one token add accounts to this server
      # and drive their logins from a desktop Artemis — the way in when there is
      # no usable shell in here. Give it to your own connection and to no other.
      # ARTEMIS_BOOTSTRAP_CONNECTIONS: >-
      #   [{"label":"laptop","token":"${ARTEMIS_LAPTOP_TOKEN}",
      #     "manageProfiles":true,
      #     "workspace":{"kind":"directory","path":"/work/my-repo"}}]
      # Uncomment to name the hosts this server answers to instead of `any`
      # (the default for a non-loopback bind):
      # ARTEMIS_ALLOWED_HOSTS: 'artemis.tailnet.example,100.101.102.103'
      # Bypass permissions on a served Claude account. The image runs as root
      # and Claude Code refuses `--dangerously-skip-permissions` under root —
      # "cannot be used with root/sudo privileges" — so the mode is withheld
      # from the capability list and a run asking for it dies on spawn. This is
      # the CLI's own opt-in: it says the container *is* the sandbox, the flag
      # is accepted as root again, and the server offers the mode. Set it only
      # where you accept what it means: a run that never asks can use anything
      # this container can reach — every mounted repository, every credential
      # in /data, every tool on PATH.
      # IS_SANDBOX: '1'
      # Let a served Claude run drive a Chrome, through the Claude-in-Chrome
      # extension. No browser is needed in this container: the CLI pairs with
      # the extension through Anthropic's relay, *by account*, so the Chrome a
      # run drives is whichever one is signed in to claude.ai as the serving
      # account - on any machine. That is also the caution: every connection
      # allowed an account can then act in that account owner's browser, with
      # their logins. Right for a server that is all one person's; on a shared
      # one it hands teammates each other's logins. Off unless set to '1'.
      # ARTEMIS_ALLOW_CHROME_BROWSER: '1'
      # How long a run whose client detached is kept before it is reaped, and
      # how long a permission prompt waits for an answer. Both are ceilings on
      # behaviour a completions client has to opt into per request; the defaults
      # (6h, 15m) suit a laptop that sleeps and a person who answers prompts.
      # ARTEMIS_DETACHED_RUN_TTL_MS: '21600000'
      # ARTEMIS_PERMISSION_PARK_MS: '900000'
      #
      # ----------------------------------------------------------------------
      # A browser beside the server (see the `browser` service below)
      # ----------------------------------------------------------------------
      # With this set, a served run gets the `artemisBrowser` tools over the
      # headless Chromium in the `browser` service: open a page, read it, click,
      # type, screenshot, and read the console, the network log, the cookies and
      # the storage. Unset — the default — a served run has no browser tools and
      # nothing else about this deployment changes.
      #
      # The name is resolved to an address before the DevTools port is asked
      # anything, because Chromium refuses an HTTP request to that port whose
      # Host header is a name. Write the service name here anyway; the server
      # does the resolving.
      # ARTEMIS_BROWSER_CDP_URL: 'http://browser:9222'
      #
      # The limits. Every one of these is a number, not a switch: the rules
      # themselves cannot be turned off, because the failure they exist to
      # prevent is a browser holding memory for pages nobody is looking at.
      # Defaults shown.
      #
      # How many conversations may have a browser open at once. A third is
      # refused with a sentence the agent can act on.
      # ARTEMIS_BROWSER_MAX_CONTEXTS: '2'
      # Minutes without a browser tool call before that conversation's tab is
      # closed and its memory given back. The run is told on its next call.
      # ARTEMIS_BROWSER_IDLE_MINUTES: '10'
      # Heap one tab may hold before the watchdog closes it. The `mem_limit` on
      # the browser service below is the backstop behind this; keep it set.
      # ARTEMIS_BROWSER_TAB_MEMORY_MB: '500'
      # `0` stops the server asking Chromium to exit after five minutes with
      # nothing open. Leave it on: `restart: unless-stopped` below is what
      # brings the browser back, and a process that has exited holds no memory,
      # which is the only way to be sure a leaked renderer is really gone.
      # ARTEMIS_BROWSER_IDLE_EXIT: '1'
      #
      # Internal hosts the agent may open, comma-separated, on top of loopback
      # and `artemis-server`. This browser sits inside your network and can
      # route to everything the container can, so the rule is the opposite of a
      # normal block list: the public internet is open, and anything private is
      # shut unless you name it here. Cloud metadata addresses are refused
      # whatever this says.
      # ARTEMIS_BROWSER_ALLOW_HOSTS: 'staging.internal,192.168.1.50'
    # Uncomment together with the `browser` service and the `networks` block at
    # the foot of this file. The server has to be on both networks: `default`
    # for its published port, `browser` to reach the browser at all.
    # networks:
    #   - default
    #   - browser

  # --------------------------------------------------------------------------
  # The browser. Off by default; uncomment this service, the variables above,
  # and the `networks:` block at the foot of the file, then:
  #
  #   docker compose -f docker/docker-compose.yml up -d --build browser
  #
  # Nothing in here is Artemis. It is a Chromium with a DevTools port, and the
  # server is the only thing that can reach it.
  # --------------------------------------------------------------------------
  # browser:
  #   build:
  #     context: ..
  #     dockerfile: docker/browser.Dockerfile
  #   container_name: artemis-browser
  #   # The point of the restart policy, not a courtesy: the server asks
  #   # Chromium to *exit* after five minutes with nothing open, because a
  #   # process that has exited holds no memory and Chromium does not hand a
  #   # freed heap back to the system readily. This line is what brings it back
  #   # for the next page. If you change it to something that will not restart
  #   # the container, set ARTEMIS_BROWSER_IDLE_EXIT=0 on the server as well.
  #   restart: unless-stopped
  #   # A browser that leaks takes itself down rather than the agents. The
  #   # server has no limit of its own and has been OOM-killed by a session that
  #   # ran a headless browser among other things; this is the fence around that.
  #   # The per-tab ceiling above is the first line of defence and this is the
  #   # backstop, because CDP can only report a tab's *heap*, which is a floor
  #   # on what a renderer really holds.
  #   mem_limit: 1g
  #   # Chromium's renderers want more than Docker's default 64 MB of /dev/shm.
  #   # The image passes --disable-dev-shm-usage instead, which spends disk
  #   # rather than the memory this limit exists to bound. Raise this only if
  #   # you drop that flag.
  #   # shm_size: 1gb
  #   # No `ports:`. The DevTools port is total authority over this browser and
  #   # has no authentication of its own — publishing it would hand that
  #   # authority to anything that could reach the host.
  #   networks:
  #     - browser
  #   # Nothing of yours is mounted here. The browser reads your dev servers
  #   # over the network like any other client, and a page it loads should not
  #   # be one filesystem hop from your repositories.

# volumes and networks
# ----------------------------------------------------------------------------
# `browser` is a network with exactly two containers on it: the server, and the
# browser. That is the whole reachability story, and it is worth being plain
# about what it does and does not buy.
#
# It buys: nothing else on this host, and nothing outside it, can reach the
# DevTools port. It does not buy a one-way link — Docker's bridge networks are
# symmetrical, so the browser can also reach the server, which is the point
# (`http://artemis-server:3000` is the dev server the agent is testing).
#
# What it cannot do is filter what a *page* asks for. The server refuses to
# navigate to a private address it was not told about, and re-checks after every
# redirect — but an `<img src>` or a `fetch()` inside a loaded page happens in
# Chromium's own network stack, below anything the DevTools protocol can veto
# without putting an Artemis round trip in front of every subresource of every
# page. If your network has things on it that an unauthenticated GET would
# damage, the fence is at the network level and nowhere else: give the browser
# an egress rule that allows the server and the public internet and denies the
# rest of your private space. On plain Docker that is an iptables rule or a
# proxy; under Kubernetes it is a NetworkPolicy. See docs/SERVER-BROWSER.md.
# networks:
#   browser:
#     driver: bridge

volumes:
  artemis-data:
