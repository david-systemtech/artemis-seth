name: CI

on:
  pull_request:
  push:
    branches: [main]
  # A failed run whose cause was environmental — a flaky download, a runner
  # hiccup — should be retryable without manufacturing an empty commit.
  workflow_dispatch:

# A run superseded by a newer push to the same ref is checking a commit nobody
# will merge — cancel it and give the runner to the one somebody will.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # The browser extension is built here as well as at release time, for the
      # reason `pnpm build` is: a package whose build only runs when a tag is
      # pushed ships its regressions blind, and this one ends up in someone's
      # browser. The script exits 0 with a notice on a checkout that has no
      # `apps/extension` — that is a branch predating the extension, not a
      # broken build — and non-zero when the package is there and will not
      # build. See scripts/package-extension.ts.
      - name: Build the browser extension
        run: pnpm exec tsx scripts/package-extension.ts
      # Production bundling is its own way to fail — electron-vite resolves,
      # tree-shakes and externalizes differently from the dev server, and an
      # Electron app whose bundling only runs at release time ships bundling
      # regressions blind. This is the same `pnpm run build` the release
      # workflow performs before packaging, exercised on every change.
      - run: pnpm build

  # Windows is a product platform, not just a release target: the suite covers
  # behavior that only exists there — `.cmd` shim spawning, junction links in
  # the profile farm, drive-letter path semantics — and a regression in any of
  # it is invisible on Ubuntu. A separate job rather than a matrix so the
  # `checks` status name existing branch protection knows stays put.
  checks-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
